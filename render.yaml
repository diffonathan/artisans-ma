# Déploiement de la démonstration sur Render (offre gratuite).
#
# À importer depuis render.com → New → Blueprint, en pointant ce dépôt.
# Le détail pas à pas, y compris la création de la base, est dans
# `deploy/DEPLOIEMENT.md`.
#
# ⚠️ CE QUI EST DÉPLOYÉ N'EST PAS TOUT À FAIT L'ARCHITECTURE DU PROJET.
#
# Le dépôt tient deux applications séparées : une API NestJS (`api/`) et une
# interface Next.js (`web/`), chacune avec ses dépendances, ses tests et son
# cycle de vie. Ici, les deux tournent dans UN conteneur.
#
# Raison : l'offre gratuite endort un service après quinze minutes sans visite.
# Avec deux services, l'interface se réveille, interroge une API encore
# endormie, et le visiteur reçoit une erreur — puis une page correcte s'il
# recharge. Un seul conteneur dort et se réveille d'un bloc.
#
# Ce qui reste vrai : tout le code, les index et les transactions, les
# garanties du domaine, et la séparation des deux applications dans le dépôt.
# Ce qui est perdu : le déploiement et le dimensionnement indépendants.
#
# Mesuré sur l'image : 161 Mio au repos, pour 512 disponibles.

services:
  - type: web
    name: artisans-ma
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt # la plus proche du Maroc parmi les régions gratuites
    plan: free
    autoDeploy: true

    # La racine de l'interface. Elle ne dépend pas de l'API pour répondre, donc
    # elle reste saine pendant que la base se prépare — ce qui est exactement
    # ce qu'un contrôle de santé doit mesurer : « le service écoute-t-il ? »,
    # et non « toutes ses dépendances sont-elles prêtes ? ».
    healthCheckPath: /

    envVars:
      # ── À RENSEIGNER À LA MAIN dans le tableau de bord ───────────────────
      # Jamais ici : ce fichier est public.

      # Chaîne MongoDB Atlas, offre M0 (gratuite et permanente) :
      #   mongodb+srv://utilisateur:motdepasse@grappe.xxxxx.mongodb.net/artisans
      #
      # SANS `directConnection=true`. Ce réglage est destiné au montage local,
      # où le replica set à un nœud s'annonce sur une adresse injoignable
      # depuis l'hôte. Sur Atlas, qui est un replica set à trois nœuds, il
      # collerait le pilote à un seul d'entre eux et supprimerait la bascule
      # automatique. Le script de démarrage avertit s'il le trouve.
      - key: MONGO_URI
        sync: false

      # Tirée au hasard, et propre à ce déploiement.
      #
      # Sans elle, le script de démarrage REFUSE de démarrer. C'est voulu :
      # la valeur de repli du code est écrite en clair dans un dépôt public,
      # et démarrer avec elle donnerait des sessions que n'importe qui forge.
      #
      # `generateValue` plutôt que `sync: false` : l'hébergeur la tire lui-même
      # et la garde en secret. Personne ne la copie, elle ne transite par aucun
      # presse-papiers et elle n'apparaît dans aucun fichier — alors qu'une
      # valeur saisie à la main doit bien être produite quelque part, et c'est
      # ce « quelque part » qui fuit. Il reste donc UNE seule valeur à saisir
      # au tableau de bord, MONGO_URI, celle qu'on ne peut pas deviner.
      - key: JWT_SECRET
        generateValue: true

      # ── Réglages fixes ──────────────────────────────────────────────────

      # Le jeu de démonstration se sème TOUT SEUL si la base est vide, et ne
      # touche à rien sinon : il n'y a donc RIEN à régler ici pour la première
      # mise en ligne. Ce réglage valait 0, devait passer à 1 le temps du
      # premier déploiement, puis revenir à 0 — trois passages au tableau de
      # bord, et une démonstration vide le jour où l'on oubliait le premier.
      #
      # Le poser à 1 force un semis COMPLET, qui ÉCRASE la base. C'est la
      # remise à zéro volontaire, et elle doit le rester : ne pas le laisser
      # à 1, sinon la démonstration se réinitialise à chaque réveil du
      # conteneur, sous les yeux du visiteur en cours.

      # 8,00 % — figé sur chaque réservation à l'acceptation du devis. Changer
      # cette valeur n'affecte que les réservations futures.
      - key: COMMISSION_POINTS_DE_BASE
        value: "800"

      - key: NODE_ENV
        value: production
